
name: Build SignPlus JARs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.1.2"
            fabric_api: "0.155.3+26.1.2"
          - minecraft: "26.3"
            fabric_api: "0.164.0+26.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"


  

     
  
      - name: Build
        shell: bash
        run: |
          echo "目前目錄："
          pwd
          echo "根目錄檔案："
          ls -la
          echo "尋找 settings.gradle："
          find . -name settings.gradle -print
          if [ -f "SignPlus-Fabric-Project/settings.gradle" ]; then
            cd SignPlus-Fabric-Project
          elif [ ! -f "settings.gradle" ]; then
            echo "::error::找不到 Gradle 專案設定檔"
            exit 1
          fi
          gradle build
        env:
          ORG_GRADLE_PROJECT_minecraft_version: ${{ matrix.minecraft }}
          ORG_GRADLE_PROJECT_fabric_api_version: ${{ matrix.fabric_api }}
          ORG_GRADLE_PROJECT_loader_version: "0.19.5"
          ORG_GRADLE_PROJECT_mod_version: "0.1.0"


      - uses: actions/upload-artifact@v4
        with:
          name: SignPlus-Minecraft-${{ matrix.minecraft }}
          path: '**/build/libs/*.jar'
          if-no-files-found: error
